version: "3.9"

services:
  jupyter:
    build:
      context: ./docker/jupyter
    container_name: pv_jupyter
    restart: unless-stopped
    environment:
      TZ: America/Sao_Paulo
      JUPYTER_ENABLE_LAB: "yes"
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-python@2026}
      PYTHONPATH: /workspace
    ports:
      - "${JUPYTER_PORT:-8888}:8888"
    volumes:
      - ./:/workspace
    working_dir: /workspace
    command: >
      start-notebook.sh
      --NotebookApp.token='${JUPYTER_TOKEN:-python@2026}'
      --NotebookApp.notebook_dir=/workspace
