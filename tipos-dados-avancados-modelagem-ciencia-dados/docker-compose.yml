version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: fs_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fs_mix}
      POSTGRES_USER: ${POSTGRES_USER:-fs_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fs_pass}
      TZ: America/Sao_Paulo
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fs_user} -d ${POSTGRES_DB:-fs_mix}"]
      interval: 10s
      timeout: 5s
      retries: 10

  jupyter:
    build:
      context: ./docker/jupyter
    container_name: fs_jupyter
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: America/Sao_Paulo
      JUPYTER_ENABLE_LAB: "yes"
      PYTHONPATH: /workspace/src
      INPUT_DIR: /workspace/data/pending
      PROCESSED_DIR: /workspace/data/processed
      FAILED_DIR: /workspace/data/failed
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-fs_mix}
      POSTGRES_USER: ${POSTGRES_USER:-fs_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fs_pass}
      POSTGRES_SCHEMA_BRONZE: bronze
      POSTGRES_SCHEMA_SILVER: silver
      POSTGRES_SCHEMA_GOLD: gold
    ports:
      - "${JUPYTER_PORT:-8888}:8888"
    volumes:
      - ./:/workspace
    working_dir: /workspace
    command: >
      start-notebook.sh
      --NotebookApp.token='${JUPYTER_TOKEN:-python@2026}'
      --NotebookApp.notebook_dir=/workspace

volumes:
  postgres_data:
